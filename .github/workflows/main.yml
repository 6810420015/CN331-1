name: Django CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ProjectFiles

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install django flake8 black bandit coverage dj-database-url whitenoise

    - name: Check Code Formatting (Black)
      continue-on-error: true
      run: black --check --exclude=migrations .

    - name: Lint Code (Flake8)
      continue-on-error: true
      run: flake8 . --exclude=migrations,venv,.venv --max-line-length=120 --ignore=E501,F401,F841

    - name: Security Scan (Bandit)
      continue-on-error: true
      run: bandit -r . -x migrations,venv,.venv

    - name: Run Tests and Coverage
      run: |
        coverage run --source='debates' manage.py test
        coverage report
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r ProjectFiles/requirements.txt
