name: Django CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install django flake8 black bandit coverage
        # ถ้าโปรเจกต์มีไฟล์ requirements.txt 
        # pip install -r requirements.txt

    - name: Check Code Formatting (Black)
      run: black --check --exclude=migrations .

    - name: Lint Code (Flake8)
      run: flake8 . --exclude=migrations,venv,.venv --max-line-length=119

    - name: Security Scan (Bandit)
      run: bandit -r . -x migrations,venv,.venv

    - name: Run Tests and Coverage
      run: |
        coverage run manage.py test
        coverage report
