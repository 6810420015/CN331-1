
{% load static %}
<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบโต้วาที</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        .topic-card {
            word-break: break-word;
            overflow-wrap: break-word;
        }

        @media (max-width: 576px) {
            .topic-card h2 {
                font-size: 1.25rem;
            }

            h1 {
                font-size: 1.75rem;
            }
        }

        body {
            font-family: 'Prompt', sans-serif;
        }

        input[type="text"],
        input[type="password"],
        textarea,
        select {
            display: block;
            width: 100%;
            padding: 0.375rem 0.75rem;
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
            margin-bottom: 15px;
            font-family: inherit;
        }

        .navbar-custom {
            background-color: #ff7b00 !important;
        }

        .navbar-custom .navbar-brand {
            color: #ffffff !important;
            font-weight: bold;
        }

        .topic-card {
            background-color: #ffffff;
            border-left: 5px solid #ff7b00;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .topic-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(255, 123, 0, 0.15);
        }

        .btn-orange {
            background-color: #ff7b00 !important;
            color: white !important;
            border: none;
        }

        .btn-orange:hover {
            background-color: #e66a00 !important;
        }

        .btn-outline-orange {
            color: #ff7b00 !important;
            border: 1px solid #ff7b00 !important;
            background-color: transparent;
        }

        .btn-outline-orange:hover {
            background-color: #ff7b00 !important;
            color: white !important;
        }
    </style>
</head>

<body class="bg-light">
    <nav class="navbar navbar-custom mb-4">
        <div class="container">
            <a class="navbar-brand mb-0" href="{% url 'topic_list' %}">Voted topics</a>

            <div class="d-flex align-items-center ms-auto text-white">
                {% if user.is_authenticated %}
                <a href="{% url 'user_profile' %}" class="text-white text-decoration-none me-3">{{ user.username }}</a>
                <form action="{% url 'logout' %}" method="post" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-light btn-sm text-dark">ออกจากระบบ</button>
                </form>
                {% else %}
                <a href="{% url 'login' %}" class="text-white text-decoration-none me-3">เข้าสู่ระบบ</a>
                <a href="{% url 'signup' %}" class="btn btn-light btn-sm text-dark">สมัครสมาชิก</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container bg-white p-4 rounded shadow-sm">
        {% if messages %}
        <div class="mb-3" aria-live="polite">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="ปิด"></button>
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% block content %}
        {% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
